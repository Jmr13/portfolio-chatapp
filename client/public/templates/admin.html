<!DOCTYPE html>
<html>

<head>
    <title>Admin Chat</title>
</head>

<body>
    <h1>Admin Chat</h1>
    <form id="chatForm" onsubmit="sendMessage(event)">
        <input type="number" id="clientId" placeholder="User ID" required />
        <input type="text" id="messageText" placeholder="Message" autocomplete="off" required />
        <button>Send</button>
    </form>

    <ul id="messages"></ul>

    <script>
        const ADMIN_TOKEN = "";
        const ws = new WebSocket(`ws://localhost:8000/ws/admin/`, ["admin", ADMIN_TOKEN]);

        // Handle incoming messages
        ws.onmessage = function (event) {
            const messages = document.getElementById('messages');
            const messageItem = document.createElement('li');
            messageItem.textContent = event.data;
            messages.appendChild(messageItem);
        };

        // Handle sending messages to specific user
        function sendMessage(event) {
            event.preventDefault();

            const clientId = document.getElementById("clientId").value;
            const messageText = document.getElementById("messageText").value;

            if (!clientId || !messageText) return;

            // Send JSON as expected by backend
            ws.send(JSON.stringify({
                client_id: parseInt(clientId),
                message: messageText
            }));

            document.getElementById("messageText").value = '';
        }

        ws.onopen = function () {
            console.log("Connected to admin WebSocket");
        };

        ws.onclose = function () {
            console.log("WebSocket connection closed");
        };

        ws.onerror = function (err) {
            console.error("WebSocket error:", err);
        };
    </script>
</body>

</html>
