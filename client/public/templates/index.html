<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye Blink with Faster Morphing and Clipped Iris/Pupil</title>
  <style>
    svg {
      display: block;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Eye Blink with Faster Morph and Clipped Iris/Pupil</h2>

  <svg width="300" height="200" viewBox="0 0 300 200">
    <!-- Clip path with morph animation -->
    <clipPath id="eyeClip">
      <path fill="white" stroke="none">
        <animate attributeName="d"
          dur="2s"
          repeatCount="indefinite"
          values="
            M 50 100 Q 150 30 250 100 Q 150 170 50 100 Z;
            M 50 100 Q 150 100 250 100 Q 150 100 50 100 Z;
            M 50 100 Q 150 30 250 100 Q 150 170 50 100 Z"
          keyTimes="0; 0.5; 1"
          calcMode="spline"
          keySplines="0.4 0 1 1; 0 0 0.2 1"
        />
      </path>
    </clipPath>

    <!-- Eye outline path with identical morph animation -->
    <path fill="white" stroke="black" stroke-width="2">
      <animate attributeName="d"
        dur="2s"
        repeatCount="indefinite"
        values="
          M 50 100 Q 150 30 250 100 Q 150 170 50 100 Z;
          M 50 100 Q 150 100 250 100 Q 150 100 50 100 Z;
          M 50 100 Q 150 30 250 100 Q 150 170 50 100 Z"
        keyTimes="0; 0.5; 1"
        calcMode="spline"
        keySplines="0.4 0 1 1; 0 0 0.2 1"
      />
    </path>

    <!-- Iris and pupil clipped to the morphing eye shape -->
    <g clip-path="url(#eyeClip)">
      <circle cx="150" cy="100" r="30" fill="skyblue" />
      <circle cx="150" cy="100" r="10" fill="black" />
    </g>
  </svg>
</body>
</html>
